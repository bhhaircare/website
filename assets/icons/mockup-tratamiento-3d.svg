<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Base Shadow -->
    <radialGradient id="jarShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass Jar Outer Gradient -->
    <linearGradient id="jarGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="82%" stop-color="#14060E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>
    <!-- Rich Botanical Melaza Butter Inside -->
    <linearGradient id="jarMelaza" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1A9"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#9C5E18"/>
      <stop offset="100%" stop-color="#3D1224"/>
    </linearGradient>
    <!-- Polished Rose-Gold Metallic Lid -->
    <linearGradient id="jarLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8F5E1E"/>
      <stop offset="20%" stop-color="#FCE1A9"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FB3765"/>
      <stop offset="100%" stop-color="#6E0F26"/>
    </linearGradient>
    <!-- Lid Top Face Gradient -->
    <radialGradient id="lidTop" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#FCE1A9"/>
      <stop offset="80%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#FB3765"/>
    </radialGradient>
  </defs>

  <!-- Ambient Shadow -->
  <ellipse cx="50" cy="90" rx="33" ry="7" fill="url(#jarShadow)"/>

  <!-- Thick Glass Bottom Plinth -->
  <rect x="23" y="68" width="54" height="18" rx="8" fill="#180A14"/>
  <rect x="23" y="68" width="54" height="18" rx="8" fill="url(#jarGlass)"/>
  <!-- Base Rim Highlight -->
  <path d="M26 84 C38 87, 62 87, 74 84" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Jar Body Fill (Melaza Treatment) -->
  <rect x="24.5" y="47" width="51" height="35" rx="6" fill="url(#jarMelaza)"/>
  <!-- Glass Wall Overlay -->
  <rect x="23" y="46" width="54" height="38" rx="7" fill="url(#jarGlass)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Specular Reflection Stripe on Glass -->
  <path d="M27 48 L27 80 C27 81.5, 29 82, 30 82 L30 48 Z" fill="#FFFFFF" opacity="0.45"/>
  <line x1="33" y1="50" x2="33" y2="76" stroke="#FFFFFF" stroke-width="0.9" opacity="0.25" stroke-linecap="round"/>

  <!-- Botanical Emblem Badge in center of jar -->
  <rect x="42" y="58" width="16" height="16" rx="4" fill="rgba(18,6,14,0.7)" stroke="rgba(212,175,55,0.5)" stroke-width="0.8"/>
  <!-- Botanical Leaf / Drop in gold -->
  <path d="M50 61 C53 64, 55 67, 50 71 C45 67, 47 64, 50 61 Z" fill="#FCE1A9"/>
  <circle cx="50" cy="67" r="1" fill="#FB3765"/>

  <!-- Rose Gold Metallic Jar Lid Rim -->
  <rect x="21" y="38" width="58" height="11" rx="4" fill="url(#jarLid)"/>
  <!-- Thread Chamfer Lines -->
  <line x1="22" y1="48.5" x2="78" y2="48.5" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>

  <!-- Beveled Top of Lid (3D Perspective Oval) -->
  <ellipse cx="50" cy="38" rx="29" ry="6.5" fill="url(#lidTop)" stroke="#FFFFFF" stroke-width="0.8" opacity="0.9"/>
  <!-- Inner Rim Emboss -->
  <ellipse cx="50" cy="38" rx="22" ry="4.5" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
  <text x="50" y="40" font-family="'Outfit',sans-serif" font-size="4.2" font-weight="900" fill="#7A182F" text-anchor="middle" letter-spacing="1">MELAZA PURA</text>

  <!-- Specular Crescent on Top Lid -->
  <path d="M28 36 C34 33, 44 33, 52 35" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>

  <!-- Floating Organic Honey Drop Accent Left -->
  <ellipse cx="18" cy="46" rx="2.5" ry="3.5" fill="#FCE1A9"/>
  <path d="M18 41 L19.5 45 Q20.5 48 18 49.5 Q15.5 48 16.5 45 Z" fill="#D4AF37"/>
  <circle cx="17.2" cy="45.5" r="0.8" fill="#FFFFFF" opacity="0.8"/>
</svg>
