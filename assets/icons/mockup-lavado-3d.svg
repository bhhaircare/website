<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Base Shadow -->
    <radialGradient id="pumpShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Bottle Cylindrical Body Gradient -->
    <linearGradient id="pumpBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D1222"/>
      <stop offset="18%" stop-color="#FF6B93"/>
      <stop offset="42%" stop-color="#FB3765"/>
      <stop offset="75%" stop-color="#911432"/>
      <stop offset="100%" stop-color="#210A18"/>
    </linearGradient>
    <!-- Metallic Rose Gold Collar -->
    <linearGradient id="pumpCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C6B28"/>
      <stop offset="25%" stop-color="#FCE1A9"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#FB3765"/>
      <stop offset="100%" stop-color="#661026"/>
    </linearGradient>
    <!-- Pump Head Head Shading -->
    <linearGradient id="pumpHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D1829"/>
      <stop offset="40%" stop-color="#1E0A15"/>
      <stop offset="100%" stop-color="#0A0207"/>
    </linearGradient>
    <!-- Foam / Lather Bubble Pearl -->
    <radialGradient id="bubblePearl" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FCE1A9"/>
      <stop offset="85%" stop-color="#FF99B8"/>
      <stop offset="100%" stop-color="#FB3765"/>
    </radialGradient>
  </defs>

  <!-- Floor Shadow -->
  <ellipse cx="50" cy="91" rx="26" ry="6" fill="url(#pumpShadow)"/>

  <!-- Bottle Body Cylinder -->
  <rect x="34" y="42" width="32" height="46" rx="8" fill="url(#pumpBody)"/>
  <!-- Base Curve Highlight -->
  <path d="M37 86 C45 88.5, 55 88.5, 63 86" stroke="rgba(255,255,255,0.3)" stroke-width="1" stroke-linecap="round"/>

  <!-- 3D Specular Light Stripe Down Body -->
  <rect x="38" y="43" width="3.5" height="43" rx="1.7" fill="#FFFFFF" opacity="0.45"/>
  <line x1="43.5" y1="45" x2="43.5" y2="84" stroke="#FFFFFF" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>

  <!-- Botanical Product Label -->
  <rect x="42" y="55" width="16" height="22" rx="3" fill="rgba(18,6,14,0.6)" stroke="rgba(212,175,55,0.4)" stroke-width="0.8"/>
  <text x="50" y="63" font-family="'Outfit',sans-serif" font-size="5" font-weight="900" fill="#FCE1A9" text-anchor="middle">SHAMPOO</text>
  <text x="50" y="69" font-family="'Outfit',sans-serif" font-size="3.5" font-weight="700" fill="#FFF" text-anchor="middle" opacity="0.9">0% SULFATOS</text>
  <circle cx="50" cy="73" r="1.2" fill="#FB3765"/>

  <!-- Bottle Shoulder Transition -->
  <path d="M34 44 C34 38, 42 37, 44 37 L56 37 C58 37, 66 38, 66 44 Z" fill="#421A2F"/>
  <path d="M34 44 C34 38, 42 37, 44 37 L56 37 C58 37, 66 38, 66 44 Z" fill="url(#pumpBody)" opacity="0.8"/>

  <!-- Pump Metallic Collar -->
  <rect x="43" y="32" width="14" height="6.5" rx="2" fill="url(#pumpCollar)"/>
  <line x1="43" y1="35.5" x2="57" y2="35.5" stroke="#FFFFFF" stroke-width="0.8" opacity="0.6"/>

  <!-- Pump Stem Rod -->
  <rect x="47.5" y="25" width="5" height="8" rx="1" fill="#FFFFFF" opacity="0.85"/>

  <!-- Ergonomic Curved Pump Dispenser Head -->
  <!-- Top Curve with Spout extending to the left -->
  <path d="M53 19 C53 17, 48 16, 46 16 L28 19 C25 19.5, 24 21, 24 23 C24 24.5, 26 25, 28 24.5 L46 22 L46 26 C46 27, 53 27, 53 26 Z" fill="url(#pumpHead)"/>
  <path d="M53 19 C53 17, 48 16, 46 16 L28 19 C25 19.5, 24 21, 24 23 C24 24.5, 26 25, 28 24.5 L46 22 L46 26 C46 27, 53 27, 53 26 Z" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>

  <!-- Top Head Specular Highlight -->
  <path d="M47 17.5 L30 20 C27 20.5, 26 21.5, 26 22.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>

  <!-- Pearlescent Cleansing Drops / Bubbles (Botanical Foam) -->
  <circle cx="23" cy="27" r="3.2" fill="url(#bubblePearl)"/>
  <circle cx="22" cy="26" r="0.9" fill="#FFFFFF" opacity="0.9"/>

  <circle cx="16" cy="35" r="4" fill="url(#bubblePearl)" opacity="0.85"/>
  <circle cx="14.8" cy="33.8" r="1.1" fill="#FFFFFF" opacity="0.85"/>

  <circle cx="75" cy="50" r="3.5" fill="url(#bubblePearl)" opacity="0.7"/>
  <circle cx="74" cy="49" r="0.9" fill="#FFFFFF" opacity="0.8"/>
</svg>
