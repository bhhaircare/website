<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Shadow -->
    <radialGradient id="kitShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Isometric Top Face -->
    <linearGradient id="kitTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D152B"/>
      <stop offset="100%" stop-color="#240A1A"/>
    </linearGradient>
    <!-- Isometric Left Face (Shaded) -->
    <linearGradient id="kitLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B0713"/>
      <stop offset="100%" stop-color="#0D0309"/>
    </linearGradient>
    <!-- Isometric Right Face (Lit) -->
    <linearGradient id="kitRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E0E22"/>
      <stop offset="100%" stop-color="#180612"/>
    </linearGradient>
    <!-- Satin Ribbon Gradient -->
    <linearGradient id="kitRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7CA2"/>
      <stop offset="40%" stop-color="#FB3765"/>
      <stop offset="75%" stop-color="#E5BA5A"/>
      <stop offset="100%" stop-color="#D41A49"/>
    </linearGradient>
    <!-- Ribbon Top Left -->
    <linearGradient id="ribbonTopL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA8C0"/>
      <stop offset="50%" stop-color="#FB3765"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <!-- Golden Sparkle -->
    <radialGradient id="goldGlint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FCE1A9"/>
      <stop offset="100%" stop-color="#FB3765" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Floor Shadow -->
  <ellipse cx="50" cy="90" rx="34" ry="7" fill="url(#kitShadow)"/>

  <!-- 3D Isometric Box -->
  <!-- Left Side Face: (16,56) -> (50,74) -> (50,88) -> (16,70) -->
  <polygon points="16,56 50,74 50,89 16,71" fill="url(#kitLeft)"/>
  
  <!-- Right Side Face: (50,74) -> (84,56) -> (84,71) -> (50,89) -->
  <polygon points="50,74 84,56 84,71 50,89" fill="url(#kitRight)"/>

  <!-- Top Face: (50,38) -> (84,56) -> (50,74) -> (16,56) -->
  <polygon points="50,38 84,56 50,74 16,56" fill="url(#kitTop)" stroke="rgba(255,255,255,0.18)" stroke-width="0.8"/>

  <!-- Left Face Ribbon Strip: (30.5,63.5) to (35.5,66.5) down to (35.5,81.5) to (30.5,78.5) -->
  <polygon points="30.5,63.7 35.5,66.4 35.5,81.4 30.5,78.7" fill="#B31A3E"/>

  <!-- Right Face Ribbon Strip -->
  <polygon points="64.5,66.4 69.5,63.7 69.5,78.7 64.5,81.4" fill="url(#kitRibbon)"/>

  <!-- Top Face Ribbon Strip (Diagonal 1) -->
  <polygon points="46.5,40 53.5,43.5 35.5,70 28.5,66.5" fill="url(#ribbonTopL)" opacity="0.95"/>
  <!-- Top Face Ribbon Strip (Diagonal 2) -->
  <polygon points="53.5,40 46.5,43.5 64.5,70 71.5,66.5" fill="url(#kitRibbon)" opacity="0.95"/>

  <!-- Box Top Edge Highlight Lines -->
  <line x1="50" y1="38" x2="84" y2="56" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.38"/>
  <line x1="50" y1="38" x2="16" y2="56" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.25"/>
  <line x1="50" y1="74" x2="50" y2="89" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>

  <!-- 3D Satin Ribbon Bow (Top Center: around 50, 40) -->
  <!-- Left Loop Background shadow -->
  <path d="M50 42 C38 32, 28 35, 34 46 C38 52, 48 45, 50 42 Z" fill="#800C24"/>
  <!-- Left Loop Body -->
  <path d="M50 41 C36 30, 26 36, 33 47 C37 53, 47 45, 50 41 Z" fill="url(#ribbonTopL)"/>
  <!-- Left Loop Specular Shine -->
  <path d="M47 38 C39 33, 33 36, 36 43" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Right Loop Background shadow -->
  <path d="M50 42 C62 32, 72 35, 66 46 C62 52, 52 45, 50 42 Z" fill="#941632"/>
  <!-- Right Loop Body -->
  <path d="M50 41 C64 30, 74 36, 67 47 C63 53, 53 45, 50 41 Z" fill="url(#kitRibbon)"/>
  <!-- Right Loop Specular Shine -->
  <path d="M53 38 C61 33, 67 36, 64 43" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Cascading Ribbon Tails -->
  <path d="M48 44 Q 40 55 42 66 Q 44 65 47 58 Q 50 51 49 44 Z" fill="#A81938"/>
  <path d="M52 44 Q 58 56 62 67 Q 59 66 56 59 Q 52 51 52 44 Z" fill="url(#kitRibbon)"/>

  <!-- Center Knot -->
  <ellipse cx="50" cy="42" rx="4.5" ry="3.8" fill="#FCE1A9"/>
  <ellipse cx="50" cy="42" rx="3.5" ry="3" fill="url(#kitRibbon)"/>
  <circle cx="49" cy="41" r="1.2" fill="#FFFFFF" opacity="0.75"/>

  <!-- Floating Sparkles (Luxury Kit Aesthetic) -->
  <!-- Sparkle 1 (Top Right) -->
  <path d="M78 26 Q78 30 82 30 Q78 30 78 34 Q78 30 74 30 Q78 30 78 26 Z" fill="#FCE1A9"/>
  <!-- Sparkle 2 (Top Left) -->
  <path d="M22 36 Q22 39 25 39 Q22 39 22 42 Q22 39 19 39 Q22 39 22 36 Z" fill="#FFC2D4"/>
  <circle cx="78" cy="30" r="4" fill="url(#goldGlint)"/>
</svg>
